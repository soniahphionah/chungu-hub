<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Chungu Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <header class="page-banner">
    <h1>Feedback &amp; Comments</h1>
    <p>See what people think, and share your own experience</p>
  </header>

  <section class="section">
    <div class="container feedback-wrap">

      <!-- Comments list -->
      <div>
        <h2 class="section-title left">What people are saying</h2>
        <p id="commentsStatus" class="result-count">Loading comments...</p>
        <div id="commentsList" class="comments"></div>
      </div>

      <!-- Login + comment form -->
      <aside class="panel" id="accountPanel">
        <!-- filled by feedback.js -->
      </aside>

    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/shops.js"></script>
  <script src="js/layout.js"></script>
  <script type="module" src="js/feedback.js"></script>
</body>
</html>
