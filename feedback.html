<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Chungu Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <header class="page-banner">
    <h1>Feedback &amp; Comments</h1>
    <p>Tell us what you think</p>
  </header>

  <section class="section">
    <div class="container">
      <div id="testimonials" class="testimonials"></div>

      <form class="form ajax-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <h3>Leave your feedback</h3>
        <input type="text" name="name" placeholder="Your name" required>
        <select name="rating" required>
          <option value="">Rating</option>
          <option value="5">★★★★★ Excellent</option>
          <option value="4">★★★★ Good</option>
          <option value="3">★★★ Okay</option>
          <option value="2">★★ Poor</option>
          <option value="1">★ Very poor</option>
        </select>
        <textarea name="message" rows="4" placeholder="Your comment or suggestion" required></textarea>
        <button class="btn btn-call" type="submit">Send feedback</button>
        <p class="form-status"></p>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/content.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
