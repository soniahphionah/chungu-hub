<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Chungu Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <header class="page-banner">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you</p>
  </header>

  <section class="section">
    <div class="container contact-wrap">
      <div>
        <h2 class="section-title left">Get in touch</h2>
        <ul class="info-list">
          <li>📍 Nairobi, Kenya</li>
          <li>📞 +254 783 658 068</li>
          <li>✉️ hello@chunguhub.co.ke</li>
        </ul>
        <a class="btn btn-whatsapp" target="_blank" rel="noopener" href="https://wa.me/254783658068?text=Hello%20Chungu%20Hub">Chat on WhatsApp</a>
        <p class="note">Own a pottery shop, or know one that is not listed? Message us to get it added to Chungu Hub.</p>
      </div>

      <form class="form ajax-form" action="https://formspree.io/f/moeedbvb" method="POST">
        <h3>Send us a message</h3>
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <textarea name="message" rows="4" placeholder="How can we help?" required></textarea>
        <button class="btn btn-call" type="submit">Send message</button>
        <p class="form-status"></p>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
